services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: clearsettle_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ClearSettle@2026!
    ports:
      - "1434:1433" 
    volumes:
      - sqlserver_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clearsettle_broker
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  sqlserver_data: